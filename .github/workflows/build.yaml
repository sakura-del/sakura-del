name: Refresh profile card

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC (12:17 Asia/Tokyo)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.svg"
      - "cache/**"

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pillow

      - name: Generate dark_mode.svg / light_mode.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py --refresh

      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/stats.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
